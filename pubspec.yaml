name: dotnet
description: "YWT is re-balancing tech by making self-hosting more accessible."
version: 8.0.2
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.13.0

  # Community
  line_icons: ^2.0.3
  provider: ^6.1.5+1
  
  # YWT
  oui_bios:
    path: ../oui_bios
  open_ui:
    path: ../open_ui

dev_dependencies:
  dependency_validator: ^5.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/app-icon.png
    - assets/images/duck-duck-fetch.png
    - assets/images/fah.png
    - assets/images/la-grenouille.png
    - assets/images/las-rosas.png
    - assets/images/loading-dark.gif
    - assets/images/loading-light.gif
    - assets/images/open-ui-icon.png
    - assets/images/sos-icon.png
    - assets/images/the-hood.png
    - assets/videos/open-ui-demo.mp4
    - assets/videos/sos-promo-vertical.mp4
    - assets/videos/sos-promo.mp4
    - assets/videos/captions/sos-promo-ar.srt
    - assets/videos/captions/sos-promo-de.srt
    - assets/videos/captions/sos-promo-en.srt
    - assets/videos/captions/sos-promo-es.srt
    - assets/videos/captions/sos-promo-fil.srt
    - assets/videos/captions/sos-promo-fr.srt
    - assets/videos/captions/sos-promo-hi.srt
    - assets/videos/captions/sos-promo-ht.srt
    - assets/videos/captions/sos-promo-ja.srt
    - assets/videos/captions/sos-promo-ko.srt
    - assets/videos/captions/sos-promo-ru.srt
    - assets/videos/captions/sos-promo-sw.srt
    - assets/videos/captions/sos-promo-uk.srt
    - assets/videos/captions/sos-promo-zh.srt

flutter_launcher_icons:
  image_path: assets/images/app-icon.png
  adaptive_icon_foreground: assets/images/app-icon.png
  adaptive_icon_background: "#000000"
  android: false
  ios: false
  web:
    generate: true
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  image: assets/images/loading-light.gif
  color: "#F3F3F3"
  image_dark: assets/images/loading-dark.gif
  color_dark: "#171717"
  android: false
  ios: false
  web: true

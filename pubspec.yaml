name: website
description: "YWT is re-balancing tech by making self-hosting more accessible."
version: 8.0.4
publish_to: 'none'

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Flutter (Google)
  go_router: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.0

  # Community
  line_icons: ^2.0.3
  provider: ^6.1.5+1
  
  # YWT
  ywt_private:
    path: ../ywt_private
  open_ui:
    path: ../open_ui

dev_dependencies:
  dependency_validator: ^5.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/app-icon.png
    - assets/images/loading-dark.gif
    - assets/images/loading-light.gif
    
    - assets/images/community/fah.png
    
    - assets/images/liminal/clean-nebula.png
    - assets/images/liminal/duck-duck-fetch.png
    - assets/images/liminal/las-rosas.png
    - assets/images/liminal/nature-is-fab.png
    - assets/images/liminal/productivity.png
    - assets/images/liminal/sea-bomb-cleaner.png
    - assets/images/liminal/the-hood.png
    - assets/images/liminal/two-doors.png

    - assets/images/open-ui/app-icon.png

    - assets/images/sos/app-icon.png

    - assets/videos/open-ui/demo.mp4

    - assets/videos/sos/promo.mp4
    - assets/videos/sos/vertical-promo.mp4
    - assets/videos/sos/captions/sos-promo-ar.srt
    - assets/videos/sos/captions/sos-promo-de.srt
    - assets/videos/sos/captions/sos-promo-en.srt
    - assets/videos/sos/captions/sos-promo-es.srt
    - assets/videos/sos/captions/sos-promo-fil.srt
    - assets/videos/sos/captions/sos-promo-fr.srt
    - assets/videos/sos/captions/sos-promo-hi.srt
    - assets/videos/sos/captions/sos-promo-ht.srt
    - assets/videos/sos/captions/sos-promo-ja.srt
    - assets/videos/sos/captions/sos-promo-ko.srt
    - assets/videos/sos/captions/sos-promo-ru.srt
    - assets/videos/sos/captions/sos-promo-sw.srt
    - assets/videos/sos/captions/sos-promo-uk.srt
    - assets/videos/sos/captions/sos-promo-zh.srt

flutter_launcher_icons:
  image_path: assets/images/app-icon.png
  adaptive_icon_foreground: assets/images/app-icon.png
  adaptive_icon_background: "#000000"
  android: false
  ios: false
  web:
    generate: true
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  image: assets/images/loading-light.gif
  color: "#F3F3F3"
  image_dark: assets/images/loading-dark.gif
  color_dark: "#171717"
  android: false
  ios: false
  web: true
